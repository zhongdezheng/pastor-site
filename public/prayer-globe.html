<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:transparent; overflow:hidden; width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="g"></canvas>
<script>
(function(){
var c=document.getElementById('g'),ctx=c.getContext('2d');
var w=c.width=440,h=c.height=440;
var points=[];
// Generate sphere lat/lng points
for(var i=0;i<600;i++){
  var lat=Math.asin(2*Math.random()-1);
  var lng=Math.random()*Math.PI*2;
  points.push({lat:lat,lng:lng});
}
// Add some "continent" clusters
for(var k=0;k<4;k++){
  var clat=Math.asin(2*Math.random()-1),clng=Math.random()*Math.PI*2;
  for(var j=0;j<80;j++){
    var lat=clat+(Math.random()-0.5)*0.6;
    var lng=clng+(Math.random()-0.5)*0.6;
    points.push({lat:lat,lng:lng});
  }
}
var rotY=0,rotX=0.3,vRy=0,vRx=0;
var drag=false,px=0,py=0;

function project(lat,lng,ry,rx){
  var cosL=Math.cos(lat),sinL=Math.sin(lat);
  var cosG=Math.cos(lng+ry),sinG=Math.sin(lng+ry);
  var x=cosL*cosG,y=sinL,z=cosL*sinG;
  // rotate around X
  var cosX=Math.cos(rx),sinX=Math.sin(rx);
  var ny=y*cosX-z*sinX,nz=y*sinX+z*cosX;
  return {x:x,y:ny,z:nz};
}

function draw(){
  ctx.clearRect(0,0,w,h);
  var R=170;
  // Draw wireframe sphere
  ctx.strokeStyle='rgba(120,110,100,0.15)';
  ctx.lineWidth=1;
  // meridians
  for(var i=0;i<12;i++){
    var angle=Math.PI*i/12;
    ctx.beginPath();
    for(var j=0;j<=60;j++){
      var lat=Math.PI*j/60-Math.PI/2;
      var p=project(lat,angle,rotY,rotX);
      var sx=w/2+p.x*R, sy=h/2+p.z*R;
      if(j===0)ctx.moveTo(sx,sy);else ctx.lineTo(sx,sy);
    }
    ctx.stroke();
  }
  // parallels
  for(var i=1;i<12;i++){
    var lat=Math.PI*i/12-Math.PI/2;
    if(Math.abs(lat)>Math.PI/2-0.1)continue;
    ctx.beginPath();
    for(var j=0;j<=60;j++){
      var lng=Math.PI*2*j/60;
      var p=project(lat,lng,rotY,rotX);
      var sx=w/2+p.x*R,sy=h/2+p.z*R;
      if(j===0)ctx.moveTo(sx,sy);else ctx.lineTo(sx,sy);
    }
    ctx.stroke();
  }
  // Draw dots
  for(var i=0;i<points.length;i++){
    var pt=points[i];
    var p=project(pt.lat,pt.lng,rotY,rotX);
    var sx=w/2+p.x*R,sy=h/2+p.z*R;
    var dist=Math.sqrt(sx*sx+sy*sy);
    if(dist>190)continue;
    var front=p.z>0?1:0.3;
    ctx.fillStyle='rgba(169,168,76,'+(front*0.7)+')';
    ctx.beginPath();ctx.arc(sx,sy,1.5,0,Math.PI*2);ctx.fill();
  }
}

function animate(){
  if(!drag)rotY+=0.004;
  rotY+=vRy*0.01;rotX+=vRx*0.01;
  vRy*=0.95;vRx*=0.95;
  draw();
  requestAnimationFrame(animate);
}

c.addEventListener('mousedown',function(e){drag=true;px=e.clientX;py=e.clientY;vRy=0;vRx=0;});
window.addEventListener('mouseup',function(){drag=false;});
window.addEventListener('mousemove',function(e){if(!drag)return;vRy=(e.clientX-px)*0.15;vRx=(e.clientY-py)*0.15;px=e.clientX;py=e.clientY;});
c.addEventListener('touchstart',function(e){if(e.touches.length===1){drag=true;px=e.touches[0].clientX;py=e.touches[0].clientY;vRy=0;vRx=0;}},{passive:true});
window.addEventListener('touchend',function(){drag=false;});
window.addEventListener('touchmove',function(e){if(!drag||e.touches.length!==1)return;vRy=(e.touches[0].clientX-px)*0.15;vRx=(e.touches[0].clientY-py)*0.15;px=e.touches[0].clientX;py=e.touches[0].clientY;},{passive:true});

requestAnimationFrame(animate);
})();
</script>
</body>
</html>
