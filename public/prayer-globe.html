<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; overflow: hidden; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
</style>
</head>
<body>
<script>
// Country data
var countryData = null;
try { countryData = JSON.parse(document.getElementById('data')?.textContent || '{}'); } catch(e) {}

// Load Three.js
var script = document.createElement('script');
script.src = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js';
script.onload = initGlobe;
document.head.appendChild(script);

function initGlobe() {
  var body = document.body;
  var w = body.clientWidth || 440;
  var h = body.clientHeight || 440;

  var scene = new THREE.Scene();
  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  body.appendChild(renderer.domElement);

  var camera = new THREE.PerspectiveCamera(45, w / Math.max(h, 1), 0.1, 100);
  camera.position.z = 6;

  var radius = 1.8;
  var globe = new THREE.Group();
  scene.add(globe);

  // Solid sphere
  var geo = new THREE.SphereGeometry(radius, 64, 64);
  var mat = new THREE.MeshPhongMaterial({ color: 0x8BA899, specular: 0x222222, shininess: 10, transparent: true, opacity: 0.15 });
  globe.add(new THREE.Mesh(geo, mat));

  // Wireframe
  var wGeo = new THREE.SphereGeometry(radius * 1.002, 36, 36);
  var wMat = new THREE.MeshBasicMaterial({ color: 0x6E8174, wireframe: true, transparent: true, opacity: 0.18 });
  globe.add(new THREE.Mesh(wGeo, wMat));

  // Orbit ring
  var rGeo = new THREE.TorusGeometry(radius * 1.25, 0.015, 16, 100);
  var rMat = new THREE.MeshBasicMaterial({ color: 0xB5A890, transparent: true, opacity: 0.3 });
  var ring = new THREE.Mesh(rGeo, rMat);
  ring.rotation.x = Math.PI / 2.5;
  globe.add(ring);

  // Lat/lon grid lines
  for (var lat = -60; lat <= 60; lat += 30) {
    var r = radius * Math.cos(lat * Math.PI / 180);
    var y = radius * Math.sin(lat * Math.PI / 180);
    var cGeo = new THREE.TorusGeometry(r, 0.012, 16, 64);
    var cMat = new THREE.MeshBasicMaterial({ color: 0xB5A890, transparent: true, opacity: 0.2 });
    var circle = new THREE.Mesh(cGeo, cMat);
    circle.position.y = y;
    globe.add(circle);
  }
  for (var lng = 0; lng < 180; lng += 30) {
    var lGeo = new THREE.TorusGeometry(radius, 0.012, 16, 64);
    var lMat = new THREE.MeshBasicMaterial({ color: 0xB5A890, transparent: true, opacity: 0.2 });
    var lRing = new THREE.Mesh(lGeo, lMat);
    lRing.rotation.y = lng * Math.PI / 180;
    globe.add(lRing);
  }

  // Ambient + directional light
  scene.add(new THREE.AmbientLight(0xFDFBF7, 1.5));
  var dl = new THREE.DirectionalLight(0xffffff, 1.2);
  dl.position.set(5, 3, 5);
  scene.add(dl);

  // Animate
  var prayerDots = [];
  var dragging = false, px = 0, py = 0, rotX = 0.3, rotY = 0, tRx = rotX, tRy = rotY;

  document.addEventListener('mousedown', function(e) { dragging = true; px = e.clientX; py = e.clientY; });
  window.addEventListener('mouseup', function() { dragging = false; });
  window.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    tRy += (e.clientX - px) * 0.005; tRx += (e.clientY - py) * 0.005;
    px = e.clientX; py = e.clientY;
    tRx = Math.max(-1.5, Math.min(1.5, tRx));
  });
  document.addEventListener('touchstart', function(e) {
    if (e.touches.length === 1) { dragging = true; px = e.touches[0].clientX; py = e.touches[0].clientY; }
  }, { passive: true });
  window.addEventListener('touchend', function() { dragging = false; });
  window.addEventListener('touchmove', function(e) {
    if (!dragging || e.touches.length !== 1) return;
    tRy += (e.touches[0].clientX - px) * 0.005; tRx += (e.touches[0].clientY - py) * 0.005;
    px = e.touches[0].clientX; py = e.touches[0].clientY;
    tRx = Math.max(-1.5, Math.min(1.5, tRx));
  }, { passive: true });

  window.addEventListener('resize', function() {
    var nw = body.clientWidth || 440, nh = body.clientHeight || 440;
    renderer.setSize(nw, nh);
    camera.aspect = nw / Math.max(nh, 1);
    camera.updateProjectionMatrix();
  });

  function animate() {
    requestAnimationFrame(animate);
    if (!dragging) tRy += 0.003;
    rotX += (tRx - rotX) * 0.08;
    rotY += (tRy - rotY) * 0.08;
    globe.rotation.x = rotX;
    globe.rotation.y = rotY;
    for (var i = 0; i < prayerDots.length; i++) {
      prayerDots[i].scale.setScalar(1 + Math.sin(performance.now() * 0.005 + i) * 0.15);
    }
    renderer.render(scene, camera);
  }
  animate();
}
</script>
</body>
</html>
