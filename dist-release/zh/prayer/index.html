============================================================
📌 内联脚本：代祷表单提交逻辑
   - 收集表单数据
   - POST 到 Strapi 后端 API
   - 成功后切换为成功提示
   - 失败后显示错误信息
   【修改】API地址：改 fetch URL
   【修改】字段拼接：改 body JSON 的 content 格式
============================================================
--> <script>
(function(){
  var f = document.getElementById('prayer-form');    // 表单 DOM
  if (!f) return;
  var s = document.getElementById('prayer-success'); // 成功后显示的 div
  var err = document.getElementById('prayer-error'); // 错误提示 p
  var b = f.querySelector('button');                 // 提交按钮

  // 【监听】表单提交事件
  f.addEventListener('submit', async function(e) {
    e.preventDefault();
    var d = new FormData(f);
    var country = (d.get('country')||'').trim();     // 国家 → 必填验证
    var request = (d.get('request')||'').trim();     // 事项 → 必填验证
    if (!country || !request) return;                // 【修改】必填校验逻辑

    b.textContent = '发送中...';                      // 按钮loading状态
    b.disabled = true;
    err.classList.add('hidden');                     // 清除错误

    try {
      // 【API】提交到Strapi后端
      var res = await fetch('/api/prayers', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({name: d.get('name')||'', email: d.get('email')||'', content: country + ': ' + request})
      });
      if (!res.ok) throw new Error('fail');
      f.classList.add('hidden');   // 隐藏表单
      s.classList.remove('hidden');// 显示成功提示
    } catch(e) {
      err.textContent = '发送失败，请重试。'; // 【修改】错误文案
      err.classList.remove('hidden');
    } finally {
      b.textContent = '发送代祷';    // 恢复按钮文案
      b.disabled = false;
    }
  });
})();
</script>
